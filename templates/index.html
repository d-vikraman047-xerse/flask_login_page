<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Retro/Game -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>

    <div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
        <div class="login-container">
            <div class="login-card p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold mb-2">Welcome Back</h2>
                    <p class="text-muted">Please enter your details to sign in.</p>
                </div>

                <form id="loginForm">
                    <div class="mb-4 position-relative form-group">
                        <label for="email" class="form-label text-muted small fw-semibold text-uppercase">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="Enter your email" required>
                        </div>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>

                    <div class="mb-4 position-relative form-group">
                        <label for="password" class="form-label text-muted small fw-semibold text-uppercase">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" placeholder="••••••••" required>
                            <span class="input-group-text bg-transparent border-start-0 text-muted toggle-password" style="cursor: pointer;">
                                <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                            </span>
                        </div>
                        <div class="invalid-feedback">Password is required.</div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input custom-checkbox" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-muted small" for="rememberMe">
                                Remember for 30 days
                            </label>
                        </div>
                        <a href="#" class="text-primary text-decoration-none small fw-semibold hover-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mb-4 btn-login position-relative overflow-hidden">
                        <span class="btn-text">Sign In</span>
                        <div class="spinner-border spinner-border-sm text-light d-none" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>

                    <p class="text-center text-muted small mb-0">
                        Don't have an account? <a href="#" class="text-primary text-decoration-none fw-semibold hover-link">Sign up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/static/script.js"></script>
</body>
</html>
